# Local substitutes for the Azure resources in module 20, per Q-14 (17 Nov 2026).
# Cloud Terraform waits until a provider is chosen.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: auralis
      POSTGRES_PASSWORD: auralis
      POSTGRES_DB: auralis
    ports:
      - "5432:5432"
    volumes:
      - auralis_pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: dev-meili-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - auralis_meili:/meili_data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: auralis
      MINIO_ROOT_PASSWORD: auralis-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - auralis_minio:/data
volumes:
  auralis_pg:
  auralis_meili:
  auralis_minio:
